<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — العروض</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="AdminProducts.dc.html" aria-label="رجوع للأصناف" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17201C; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 19px; font-weight: 700; flex: 1">العروض</h1>
      <a href="AdminOfferEdit.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none; margin-left: 4px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span>عرض جديد</span>
      </a>
    </div>
    <div style="display: flex; gap: 4px; background: #EEF1EF; border-radius: 12px; padding: 4px; margin: 0 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; opacity: {{o.fade}}">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: {{o.typeBg}}; color: {{o.typeFg}}">{{o.typeLabel}}</span>
            <span style="font-size: 15px; font-weight: 700">{{o.title}}</span>
            <span style="font-size: 13px; color: #3D4843">{{o.product}}</span>
          </span>
          <sc-if value="{{o.canToggle}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.on}}" aria-label="تشغيل العرض" style="width: 52px; height: 44px; flex-shrink: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
              <span style="width: 46px; height: 28px; border-radius: 14px; background: {{o.trackBg}}; display: flex; align-items: center; justify-content: {{o.knobSide}}; padding: 3px; box-sizing: border-box">
                <span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,32,28,0.25)"></span>
              </span>
            </button>
          </sc-if>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #5B6661; padding-top: 8px; border-top: 1px solid #EEF1EF">
          <span>{{o.period}}</span>
          <span>{{o.usage}}</span>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="text-align: center; padding: 40px 16px; font-size: 15px; color: #5B6661">لا توجد عروض هنا.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'active', paused: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const types = {
      discount: { label: 'خصم', bg: '#FBE9E5', fg: '#8A2A14' },
      gift: { label: 'هدية', bg: '#E6EEFB', fg: '#1E4FA8' },
      qty: { label: 'خصم الكمية', bg: '#FDF1DE', fg: '#6B2E08' }
    };
    const all = [
      { id: 1, st: 'active', type: 'discount', title: 'خصم 10%', product: '[اسم الصنف 1] · كرتونة', period: 'حتى 12 نوفمبر', usage: 'في 34 طلبًا' },
      { id: 2, st: 'active', type: 'gift', title: '10 + 1 هدية', product: '[اسم الصنف 5] · دستة', period: 'حتى 30 نوفمبر', usage: 'في 12 طلبًا' },
      { id: 3, st: 'active', type: 'qty', title: 'من 5 كراتين: [سعر الكمية] ج.م', product: '[اسم الصنف 2] · كرتونة', period: 'حتى 15 ديسمبر', usage: 'في 8 طلبات' },
      { id: 4, st: 'active', type: 'discount', title: 'خصم 15 ج.م', product: '[اسم الصنف 6] · جالون', period: 'ينتهي غدًا', usage: 'في 19 طلبًا' },
      { id: 5, st: 'scheduled', type: 'discount', title: 'خصم 5%', product: 'كل أصناف قسم 3', period: 'يبدأ 1 ديسمبر', usage: 'لم يبدأ' },
      { id: 6, st: 'ended', type: 'gift', title: '5 + 1 هدية', product: '[اسم الصنف 3] · شدّة', period: 'انتهى 31 أكتوبر', usage: 'استُخدم في 57 طلبًا' }
    ];
    const tab = this.state.tab;
    const offers = all.filter((o) => o.st === tab).map((o) => {
      const t = types[o.type];
      const on = o.st !== 'ended' && !this.state.paused[o.id];
      return {
        title: o.title, product: o.product, period: o.period + (this.state.paused[o.id] ? ' · موقوف' : ''), usage: o.usage,
        typeLabel: t.label, typeBg: t.bg, typeFg: t.fg,
        canToggle: o.st !== 'ended', on: on,
        fade: o.st === 'ended' || this.state.paused[o.id] ? 0.6 : 1,
        trackBg: on ? accent : '#A3ADA8', knobSide: on ? 'flex-end' : 'flex-start',
        toggle: () => { const p = Object.assign({}, this.state.paused); p[o.id] = !p[o.id]; this.setState({ paused: p }); }
      };
    });
    const tabs = [['active', 'الحالية'], ['scheduled', 'المجدولة'], ['ended', 'المنتهية']].map((d) => {
      const on = d[0] === tab;
      const n = all.filter((o) => o.st === d[0]).length;
      return { label: d[1] + ' (' + n + ')', bg: on ? '#FFFFFF' : 'transparent', fg: on ? accent : '#5B6661', pick: () => this.setState({ tab: d[0] }) };
    });
    return { accent: accent, tabs: tabs, offers: offers, empty: offers.length === 0 };
  }
}
</script>
</body>
</html>
