<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دخول التاجر</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
input,textarea,button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow-y: auto; padding: 36px 20px 24px; gap: 22px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <div style="width: 64px; height: 64px; border-radius: 18px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
    </div>
    <h1 style="margin: 6px 0 0; font-size: 24px; font-weight: 700">عسل للتجارة والتوزيع</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5B6661">اطلب بضاعة محلك في أي وقت، ونوصلها حتى باب المحل.</p>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px; border: 1px solid #E3E7E4">
    <div style="display: flex; gap: 4px; background: #EEF1EF; border-radius: 12px; padding: 4px">
      <button type="button" onClick="{{showLogin}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{loginBg}}; color: {{loginFg}}">دخول</button>
      <button type="button" onClick="{{showRegister}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{registerBg}}; color: {{registerFg}}">تاجر جديد</button>
    </div>

    <sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="loginPhone" style="font-size: 14px; font-weight: 600">رقم الهاتف</label>
          <input id="loginPhone" type="tel" placeholder="01XXXXXXXXX" style="height: 50px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="loginPass" style="font-size: 14px; font-weight: 600">كلمة المرور</label>
          <input id="loginPass" type="password" placeholder="••••••••" style="height: 50px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <a href="#" style="align-self: flex-start; font-size: 14px; font-weight: 500; color: {{accent}}; text-decoration: none; padding: 4px 0">نسيت كلمة المرور؟</a>
        <a href="Catalog.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">دخول</a>
      </div>
    </sc-if>

    <sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="regShop" style="font-size: 14px; font-weight: 600">اسم المحل</label>
          <input id="regShop" type="text" style="height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="regOwner" style="font-size: 14px; font-weight: 600">اسم المسؤول</label>
          <input id="regOwner" type="text" style="height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="regPhone" style="font-size: 14px; font-weight: 600">رقم الهاتف</label>
          <input id="regPhone" type="tel" placeholder="01XXXXXXXXX" style="height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="regAddress" style="font-size: 14px; font-weight: 600">عنوان المحل (المدينة والحي)</label>
          <input id="regAddress" type="text" style="height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="regCR" style="font-size: 14px; font-weight: 600">رقم السجل التجاري <span style="font-weight: 400; color: #5B6661">(اختياري)</span></label>
          <input id="regCR" type="text" inputmode="numeric" style="height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="regRep" style="font-size: 14px; font-weight: 600">كود المندوب</label>
          <input id="regRep" type="text" placeholder="مثلاً: R-12" aria-describedby="regRepHint" style="height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 14px; font-size: 16px; background: #FFFFFF; color: #17201C">
          <span id="regRepHint" style="font-size: 13px; color: #5B6661">اطلبه من المندوب الذي يزورك. إن لم يكن لديك، ستحدده الإدارة.</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: flex-start; background: #EAF3EF; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; color: #24332C">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#24332C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
          <span>سنراجع بياناتك ونفعّل حسابك، وستصلك رسالة على هاتفك.</span>
        </div>
        <button type="button" style="height: 54px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer">إرسال طلب التسجيل</button>
      </div>
    </sc-if>
  </div>

  <p style="margin: 0; text-align: center; font-size: 13px; color: #5B6661">للاستفسار: <span dir="ltr">01000667712</span></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'login' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const isLogin = this.state.mode === 'login';
    return {
      accent: accent,
      isLogin: isLogin,
      isRegister: !isLogin,
      loginBg: isLogin ? '#FFFFFF' : 'transparent',
      loginFg: isLogin ? accent : '#5B6661',
      registerBg: isLogin ? 'transparent' : '#FFFFFF',
      registerFg: isLogin ? '#5B6661' : accent,
      showLogin: () => this.setState({ mode: 'login' }),
      showRegister: () => this.setState({ mode: 'register' })
    };
  }
}
</script>
</body>
</html>
