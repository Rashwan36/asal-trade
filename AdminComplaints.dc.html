<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — الشكاوى</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
button,textarea,select{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="AdminOrders.dc.html" aria-label="رجوع للطلبات" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17201C; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 19px; font-weight: 700">الشكاوى</h1>
    </div>
    <div style="display: flex; gap: 4px; background: #EEF1EF; border-radius: 12px; padding: 4px; margin: 0 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{list}}" as="c" hint-placeholder-count="2">
      <div style="background: #FFFFFF; border: 1px solid {{c.border}}; border-radius: 16px; display: flex; flex-direction: column">
        <button type="button" onClick="{{c.toggle}}" aria-expanded="{{c.open}}" style="width: 100%; border: 0; background: transparent; padding: 14px; text-align: right; cursor: pointer; color: #17201C; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%">
            <span style="font-size: 15px; font-weight: 700">{{c.type}}</span>
            <span style="font-size: 12px; color: #5B6661">{{c.age}}</span>
          </span>
          <span style="font-size: 13px; color: #3D4843">{{c.shop}} · طلب <span dir="ltr">{{c.order}}</span> · <span dir="ltr">{{c.no}}</span></span>
          <span style="font-size: 13px; color: #5B6661">المندوب: {{c.rep}}</span>
        </button>
        <sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="background: #F5F7F6; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.7; display: flex; flex-direction: column; gap: 4px">
              <span><span style="font-weight: 700">الأصناف:</span> {{c.items}}</span>
              <span><span style="font-weight: 700">التاجر كتب:</span> {{c.text}}</span>
            </div>
            <sc-if value="{{c.hasPhoto}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; gap: 8px; align-items: center">
                <div style="width: 64px; height: 64px; border-radius: 10px; background: #D5DBD7; display: flex; align-items: center; justify-content: center">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg>
                </div>
                <span style="font-size: 13px; color: #5B6661">صورة مرفقة من التاجر</span>
              </div>
            </sc-if>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <a href="AdminOrderDetail.dc.html" style="min-height: 44px; border-radius: 12px; border: 1px solid #C9D1CC; color: #17201C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; box-sizing: border-box">فتح الطلب</a>
              <a href="#" style="min-height: 44px; border-radius: 12px; border: 1px solid #C9D1CC; color: #17201C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; box-sizing: border-box">اتصال بالتاجر</a>
            </div>
            <sc-if value="{{c.isOpenCase}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <label for="{{c.resId}}" style="font-size: 14px; font-weight: 600">الإجراء</label>
                <select id="{{c.resId}}" style="height: 48px; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 10px; font-size: 15px; background: #FFFFFF; color: #17201C">
                  <option>إرسال الصنف مع الطلب القادم</option>
                  <option>خصم على الطلب القادم</option>
                  <option>استبدال الصنف</option>
                  <option>بدون إجراء</option>
                </select>
                <label for="{{c.replyId}}" style="font-size: 14px; font-weight: 600">الرد على التاجر</label>
                <textarea id="{{c.replyId}}" rows="2" placeholder="يظهر للتاجر في صفحة شكاواه" style="box-sizing: border-box; width: 100%; border: 1px solid #C9D1CC; border-radius: 12px; padding: 10px 12px; font-size: 15px; background: #FFFFFF; color: #17201C; resize: none"></textarea>
                <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                  <button type="button" onClick="{{c.follow}}" style="min-height: 48px; border-radius: 12px; border: 1px solid #C9D1CC; background: #FFFFFF; color: #17201C; font-size: 14px; font-weight: 600; cursor: pointer">قيد المتابعة</button>
                  <button type="button" onClick="{{c.resolve}}" style="min-height: 48px; border-radius: 12px; border: 0; background: {{c.accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">تم الحل</button>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{c.isResolved}}" hint-placeholder-val="{{ false }}">
              <div style="background: #E3F1EB; color: #0B4A3B; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6"><span style="font-weight: 700">الحل:</span> {{c.resolution}}</div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="text-align: center; padding: 40px 16px; font-size: 15px; color: #5B6661">لا توجد شكاوى هنا.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'new',
      open: 'C-218',
      status: { 'C-218': 'new', 'C-216': 'new', 'C-209': 'progress', 'C-197': 'done' }
    };
  }
  setStatus(no, st) {
    const s = Object.assign({}, this.state.status);
    s[no] = st;
    this.setState({ status: s });
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const all = [
      { no: 'C-218', type: 'صنف ناقص', shop: '[اسم المحل 3]', order: '#1041', rep: '[اسم المندوب 1]', age: 'منذ 20 دقيقة', items: '[اسم الصنف 3] — المطلوب 2 شدّة', text: 'وصلت شدّة واحدة بدل اثنتين', photo: false, resolution: '' },
      { no: 'C-216', type: 'صنف تالف', shop: '[اسم المحل 6]', order: '#1038', rep: '[اسم المندوب 2]', age: 'منذ 3 ساعات', items: '[اسم الصنف 2] — كرتونة', text: 'زجاجتان مكسورتان', photo: true, resolution: '' },
      { no: 'C-209', type: 'تأخير في التوصيل', shop: '[اسم المحل 4]', order: '#1030', rep: '[اسم المندوب 1]', age: 'أمس', items: '—', text: 'الطلب وصل بعد يومين', photo: false, resolution: '' },
      { no: 'C-197', type: 'صنف تالف', shop: '[اسم المحل 1]', order: '#1031', rep: '[اسم المندوب 1]', age: '29 أكتوبر', items: '[اسم الصنف 1] — كرتونة', text: 'علب مفتوحة', photo: true, resolution: 'إرسال الصنف مع الطلب القادم — تم إرسال بديل مع طلبك التالي.' }
    ];
    const tab = this.state.tab;
    const list = all.filter((c) => this.state.status[c.no] === tab).map((c) => {
      const open = this.state.open === c.no;
      const st = this.state.status[c.no];
      return {
        no: c.no, type: c.type, shop: c.shop, order: c.order, rep: c.rep, age: c.age,
        items: c.items, text: c.text, hasPhoto: c.photo,
        resolution: c.resolution || 'تم الحل — سيظهر ردك للتاجر.',
        open: open, border: open ? accent : '#E3E7E4', accent: accent,
        isOpenCase: st !== 'done', isResolved: st === 'done',
        resId: 'res-' + c.no, replyId: 'reply-' + c.no,
        toggle: () => this.setState({ open: open ? null : c.no }),
        follow: () => this.setStatus(c.no, 'progress'),
        resolve: () => this.setStatus(c.no, 'done')
      };
    });
    const tabs = [['new', 'جديدة'], ['progress', 'قيد المتابعة'], ['done', 'تم الحل']].map((d) => {
      const on = d[0] === tab;
      const n = all.filter((c) => this.state.status[c.no] === d[0]).length;
      return { label: d[1] + ' (' + n + ')', bg: on ? '#FFFFFF' : 'transparent', fg: on ? accent : '#5B6661', pick: () => this.setState({ tab: d[0] }) };
    });
    return { accent: accent, tabs: tabs, list: list, empty: list.length === 0 };
  }
}
</script>
</body>
</html>
