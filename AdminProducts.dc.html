<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — الأصناف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
input,button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex: 1">الأصناف</h1>
      <a href="AdminImport.dc.html" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #C9D1CC; background: #FFFFFF; color: #17201C; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5"></path><path d="M7 10l5-5 5 5"></path><path d="M5 20h14"></path></svg>
        <span>استيراد</span>
      </a>
      <a href="AdminProductEdit.dc.html" style="height: 44px; padding: 0 14px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span>إضافة صنف</span>
      </a>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="position: relative; flex: 1">
        <label for="prodSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">بحث في الأصناف</label>
        <input id="prodSearch" type="search" placeholder="اسم الصنف أو الباركود" style="width: 100%; height: 46px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 44px 0 12px; font-size: 15px; background: #F5F7F6; color: #17201C">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="2">
        <button type="button" onClick="{{f.pick}}" style="height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="AdminOffers.dc.html" style="height: 44px; border-radius: 12px; border: 1px solid #C9D1CC; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8A2A14; text-decoration: none; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
        <span>العروض (4)</span>
      </a>
      <a href="AdminLists.dc.html" style="height: 44px; border-radius: 12px; border: 1px solid #C9D1CC; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: {{accent}}; text-decoration: none; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>
        <span>الأقسام والوحدات</span>
      </a>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center">
        <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 10px; background: #EEF1EF; display: flex; align-items: center; justify-content: center; opacity: {{p.fade}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A958F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
        </div>
        <a href="AdminProductEdit.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: #17201C">
          <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 12px; color: #5B6661">باركود <span dir="ltr">{{p.code}}</span> · {{p.units}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{p.stateColor}}">{{p.stateLabel}}</span>
        </a>
        <button type="button" onClick="{{p.toggle}}" aria-pressed="{{p.on}}" aria-label="{{p.switchLabel}}" style="width: 52px; height: 44px; flex-shrink: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
          <span style="width: 46px; height: 28px; border-radius: 14px; background: {{p.trackBg}}; display: flex; align-items: center; justify-content: {{p.knobSide}}; padding: 3px; box-sizing: border-box">
            <span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,32,28,0.25)"></span>
          </span>
        </button>
      </div>
    </sc-for>
  </div>

  <nav style="display: flex; background: #FFFFFF; border-top: 1px solid #E3E7E4; padding: 6px 2px 10px; flex-shrink: 0">
    <a href="AdminDashboard.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
      <span>الرئيسية</span>
    </a>
    <a href="AdminOrders.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h4"></path></svg>
      <span>الطلبات</span>
    </a>
    <a href="AdminProducts.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
      <span>الأصناف</span>
    </a>
    <a href="AdminMerchants.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"></path><path d="M4 10h16v10H4z"></path><path d="M10 20v-5h4v5"></path></svg>
      <span>التجار</span>
    </a>
    <a href="AdminReps.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.8c1.8.8 3 2.6 3.5 5.2"></path></svg>
      <span>المندوبين</span>
    </a>
    <a href="AdminStaff.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <span>الحسابات</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: { 4: true }, filter: 'all' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const base = [
      { id: 1, name: '[اسم الصنف 1]', code: '6221000000010', units: 'كرتونة، علبة' },
      { id: 2, name: '[اسم الصنف 2]', code: '6221000000027', units: 'كرتونة، زجاجة' },
      { id: 3, name: '[اسم الصنف 3]', code: '6221000000034', units: 'شدّة، قطعة' },
      { id: 4, name: '[اسم الصنف 4]', code: '6221000000041', units: 'شيكارة' },
      { id: 5, name: '[اسم الصنف 5]', code: '6221000000058', units: 'كرتونة، دستة، كيس' },
      { id: 6, name: '[اسم الصنف 6]', code: '6221000000065', units: 'كرتونة، جالون' }
    ];
    const f = this.state.filter;
    const items = base
      .filter((p) => f === 'all' || !!this.state.off[p.id])
      .map((p) => {
        const on = !this.state.off[p.id];
        return {
          name: p.name,
          code: p.code,
          units: p.units,
          on: on,
          fade: on ? 1 : 0.5,
          stateLabel: on ? 'متوفر ويظهر للتجار' : 'غير متوفر — مخفي عن التجار',
          stateColor: on ? '#0B5A47' : '#8A3B0A',
          switchLabel: 'إتاحة ' + p.name,
          trackBg: on ? accent : '#A3ADA8',
          knobSide: on ? 'flex-end' : 'flex-start',
          toggle: () => {
            const off = Object.assign({}, this.state.off);
            off[p.id] = on;
            this.setState({ off: off });
          }
        };
      });
    const offCount = base.filter((p) => !!this.state.off[p.id]).length;
    const defs = [['all', 'الكل (' + base.length + ')'], ['off', 'غير متوفر (' + offCount + ')']];
    const filters = defs.map((d) => {
      const on = d[0] === f;
      return {
        label: d[1],
        bg: on ? accent : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#17201C',
        border: on ? accent : '#C9D1CC',
        pick: () => this.setState({ filter: d[0] })
      };
    });
    return { accent: accent, items: items, filters: filters };
  }
}
</script>
</body>
</html>
