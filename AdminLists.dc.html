<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — الأقسام والوحدات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
button,input{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="AdminProducts.dc.html" aria-label="رجوع للأصناف" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17201C; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 19px; font-weight: 700">الأقسام والوحدات</h1>
    </div>
    <div style="display: flex; gap: 4px; background: #EEF1EF; border-radius: 12px; padding: 4px; margin: 0 4px">
      <button type="button" onClick="{{showCats}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{cBg}}; color: {{cFg}}">الأقسام ({{catCount}})</button>
      <button type="button" onClick="{{showUnits}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{uBg}}; color: {{uFg}}">الوحدات ({{unitCount}})</button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <label for="newItem" style="font-size: 14px; font-weight: 600">{{addLabel}}</label>
      <div style="display: flex; gap: 8px">
        <input id="newItem" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 12px; font-size: 16px; background: #FFFFFF; color: #17201C">
        <button type="button" onClick="{{add}}" style="height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">إضافة</button>
      </div>
      <span style="font-size: 12px; color: #5B6661">{{hint}}</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 4px 6px 4px 14px; border-bottom: 1px solid #EEF1EF">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; padding-right: 8px">
            <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
            <span style="font-size: 12px; color: #5B6661">{{it.usage}}</span>
          </span>
          <sc-if value="{{it.canDelete}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{it.remove}}" aria-label="حذف {{it.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #A1361B; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg>
            </button>
          </sc-if>
          <sc-if value="{{it.locked}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 12px; color: #5B6661; padding: 0 8px">مستخدم</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 12px; line-height: 1.6; color: #5B6661">لا يمكن حذف قسم أو وحدة مستخدمة في أصناف. انقل الأصناف أولًا ثم احذفها. أي تعديل هنا يظهر في قوائم التطبيق وفي تمبلت الإكسل عند تنزيله.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'units',
      draft: '',
      cats: [
        { name: 'قسم 1', n: 640 }, { name: 'قسم 2', n: 512 }, { name: 'قسم 3', n: 455 }, { name: 'قسم 4', n: 328 }
      ],
      units: [
        { name: 'قطعة', n: 410 }, { name: 'علبة', n: 380 }, { name: 'كيس', n: 295 }, { name: 'زجاجة', n: 160 },
        { name: 'جالون', n: 42 }, { name: 'شدّة', n: 88 }, { name: 'دستة', n: 230 }, { name: 'كرتونة', n: 1210 }, { name: 'شيكارة', n: 0 }
      ]
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const isCats = this.state.tab === 'cats';
    const key = isCats ? 'cats' : 'units';
    const list = this.state[key];
    const items = list.map((x) => ({
      name: x.name,
      usage: x.n > 0 ? ('مستخدم في ' + x.n + ' صنف') : 'غير مستخدم بعد',
      canDelete: x.n === 0,
      locked: x.n > 0,
      remove: () => {
        const s = {};
        s[key] = list.filter((y) => y.name !== x.name);
        this.setState(s);
      }
    }));
    return {
      accent: accent,
      items: items,
      catCount: this.state.cats.length,
      unitCount: this.state.units.length,
      cBg: isCats ? '#FFFFFF' : 'transparent',
      cFg: isCats ? accent : '#5B6661',
      uBg: isCats ? 'transparent' : '#FFFFFF',
      uFg: isCats ? '#5B6661' : accent,
      addLabel: isCats ? 'إضافة قسم جديد' : 'إضافة وحدة جديدة',
      placeholder: isCats ? 'اسم القسم' : 'مثال: كيلو، رابطة، صندوق',
      hint: isCats ? 'القسم يظهر للتاجر كتبويب في شاشة الأصناف.' : 'الوحدة تظهر في القائمة المنسدلة عند إضافة أو تعديل أي صنف.',
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e && e.target ? e.target.value : '' }),
      showCats: () => this.setState({ tab: 'cats', draft: '' }),
      showUnits: () => this.setState({ tab: 'units', draft: '' }),
      add: () => {
        const name = (this.state.draft || '').trim();
        if (!name || list.some((x) => x.name === name)) return;
        const s = { draft: '' };
        s[key] = list.concat([{ name: name, n: 0 }]);
        this.setState(s);
      }
    };
  }
}
</script>
</body>
</html>
