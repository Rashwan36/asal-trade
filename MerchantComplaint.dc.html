<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شكوى</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
button,textarea{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 14px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <a href="MyOrders.dc.html" aria-label="رجوع لطلباتي" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17201C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <h1 style="margin: 0; font-size: 19px; font-weight: 700">مشكلة في الطلب</h1>
      <span style="font-size: 13px; color: #5B6661">طلب <span dir="ltr">#1041</span> · 7 نوفمبر</span>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; font-weight: 700">ما المشكلة؟</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
            <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="min-height: 48px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: #17201C; font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 8px">{{t.label}}</button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{needsItems}}" hint-placeholder-val="{{ true }}">
        <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; font-weight: 700; margin-bottom: 4px">أي صنف؟</span>
          <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; border-bottom: 1px solid #EEF1EF">
              <input type="checkbox" checked="{{it.on}}" onChange="{{it.toggle}}" style="width: 20px; height: 20px; margin: 0; accent-color: {{it.accent}}">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 14px; font-weight: 600">{{it.name}}</span>
                <span style="font-size: 12px; color: #5B6661">المطلوب: {{it.ordered}}</span>
              </span>
            </label>
          </sc-for>
        </div>
      </sc-if>

      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <label for="complaintText" style="font-size: 15px; font-weight: 700">اشرح المشكلة <span style="font-weight: 400; color: #5B6661; font-size: 13px">(اختياري)</span></label>
        <textarea id="complaintText" rows="3" placeholder="مثلًا: وصلت كرتونة واحدة بدل اثنتين" style="box-sizing: border-box; width: 100%; border: 1px solid #C9D1CC; border-radius: 12px; padding: 12px; font-size: 15px; background: #FFFFFF; color: #17201C; resize: none"></textarea>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px dashed #A3ADA8; background: #F5F7F6; color: #3D4843; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <span>أرفق صورة (اختياري)</span>
        </button>
      </div>
    </sc-if>

    <sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <div style="width: 64px; height: 64px; border-radius: 32px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </div>
        <span style="font-size: 18px; font-weight: 700">وصلت شكواك</span>
        <span style="font-size: 14px; color: #3D4843; line-height: 1.7">رقم الشكوى <span dir="ltr" style="font-weight: 700">C-218</span>. سنتواصل معك، وتصلك رسالة عند كل تحديث.</span>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <span style="font-size: 14px; font-weight: 700; color: #3D4843">شكاواي السابقة</span>
      <sc-for list="{{history}}" as="h" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 14px; font-weight: 700">{{h.title}}</span>
            <span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: {{h.bg}}; color: {{h.fg}}">{{h.status}}</span>
          </div>
          <span style="font-size: 12px; color: #5B6661"><span dir="ltr">{{h.no}}</span> · {{h.meta}}</span>
          <sc-if value="{{h.hasReply}}" hint-placeholder-val="{{ true }}">
            <div style="background: #F5F7F6; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.6"><span style="font-weight: 700">رد الإدارة:</span> {{h.reply}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 10px 16px 16px; background: #FFFFFF; border-top: 1px solid #E3E7E4; flex-shrink: 0">
      <button type="button" onClick="{{send}}" disabled="{{blocked}}" style="width: 100%; height: 54px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; background: {{btnBg}}; color: {{btnFg}}">إرسال الشكوى</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'missing', picked: { 0: true }, sent: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const defs = [
      ['missing', 'صنف ناقص', true], ['damaged', 'صنف تالف', true],
      ['wrong', 'صنف غير المطلوب', true], ['late', 'تأخير في التوصيل', false],
      ['price', 'مشكلة في السعر', true], ['other', 'أخرى', false]
    ];
    const type = this.state.type;
    const types = defs.map((d) => {
      const on = d[0] === type;
      return { label: d[1], on: on, border: on ? accent : '#E3E7E4', bg: on ? '#F1F8F5' : '#FFFFFF',
        pick: () => this.setState({ type: d[0] }) };
    });
    const needsItems = !!(defs.find((d) => d[0] === type) || [])[2];
    const orderItems = [
      ['[اسم الصنف 3]', '2 شدّة'], ['[اسم الصنف 5]', '1 دستة'], ['[اسم الصنف 2]', '6 كرتونة']
    ];
    const items = orderItems.map((o, i) => ({
      name: o[0], ordered: o[1], on: !!this.state.picked[i], accent: accent,
      toggle: () => { const p = Object.assign({}, this.state.picked); p[i] = !p[i]; this.setState({ picked: p }); }
    }));
    const anyPicked = items.some((x) => x.on);
    const blocked = needsItems && !anyPicked;
    return {
      accent: accent,
      types: types,
      items: items,
      needsItems: needsItems,
      isForm: !this.state.sent,
      isSent: this.state.sent,
      blocked: blocked,
      btnBg: blocked ? '#E3E7E4' : accent,
      btnFg: blocked ? '#5B6661' : '#FFFFFF',
      send: () => { if (!blocked) this.setState({ sent: true }); },
      history: [
        { title: 'صنف تالف', no: 'C-197', meta: 'طلب #1031 · 29 أكتوبر', status: 'تم الحل', bg: '#E3F1EB', fg: '#0B5A47', hasReply: true, reply: 'تم إرسال بديل مع طلبك التالي.' },
        { title: 'تأخير في التوصيل', no: 'C-173', meta: 'طلب #1012 · 14 أكتوبر', status: 'تم الحل', bg: '#E3F1EB', fg: '#0B5A47', hasReply: true, reply: 'نعتذر، تمت إضافة سائق إضافي لمنطقتكم.' }
      ]
    };
  }
}
</script>
</body>
</html>
