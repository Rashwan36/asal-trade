<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإدارة — التجار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
button,select{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 20px 16px 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">التجار</h1>
    <div style="display: flex; gap: 4px; background: #EEF1EF; border-radius: 12px; padding: 4px">
      <button type="button" onClick="{{showPending}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{pendBg}}; color: {{pendFg}}">منتظر التفعيل ({{pendingCount}})</button>
      <button type="button" onClick="{{showActive}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: {{actBg}}; color: {{actFg}}">المفعّلون</button>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{isPending}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{pending}}" as="m" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
            <span style="display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 16px; font-weight: 700">{{m.shop}}</span>
              <span style="color: #5B6661">سجّل {{m.when}}</span>
            </span>
          </div>
          <div style="display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 6px">
            <span style="color: #5B6661">المسؤول</span><span style="font-weight: 600">{{m.owner}}</span>
            <span style="color: #5B6661">الهاتف</span><span style="font-weight: 600" dir="ltr">{{m.phone}}</span>
            <span style="color: #5B6661">العنوان</span><span style="font-weight: 600">{{m.address}}</span>
            <span style="color: #5B6661">السجل التجاري</span><span style="font-weight: 600; color: {{m.crColor}}">{{m.cr}}</span>
          </div>

          <sc-if value="{{m.hasRep}}" hint-placeholder-val="{{ true }}">
            <div style="background: #E3F1EB; color: #0B4A3B; border-radius: 10px; padding: 8px 12px; font-weight: 600">المندوب: {{m.repName}} · من كود <span dir="ltr">{{m.repCode}}</span></div>
          </sc-if>
          <sc-if value="{{m.noRep}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="{{m.selectId}}" style="font-weight: 600">لم يُدخل كود مندوب — اختر المندوب</label>
              <select id="{{m.selectId}}" onChange="{{m.pickRep}}" style="height: 48px; border: 1px solid #B4690E; border-radius: 12px; padding: 0 12px; font-size: 15px; background: #FFFFFF; color: #17201C">
                <option value="">اختر المندوب</option>
                <option value="R-12">[اسم المندوب 1] · R-12</option>
                <option value="R-07">[اسم المندوب 2] · R-07</option>
                <option value="R-15">[اسم المندوب 3] · R-15</option>
              </select>
            </div>
          </sc-if>

          <sc-if value="{{m.open}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 8px">
              <button type="button" onClick="{{m.approve}}" disabled="{{m.blocked}}" style="flex: 2; height: 48px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; background: {{m.approveBg}}; color: {{m.approveFg}}">تفعيل الحساب</button>
              <button type="button" onClick="{{m.reject}}" style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid #C9D1CC; background: #FFFFFF; color: #A1361B; font-size: 15px; font-weight: 600; cursor: pointer">رفض</button>
            </div>
          </sc-if>
          <sc-if value="{{m.decided}}" hint-placeholder-val="{{ false }}">
            <div style="border-radius: 10px; padding: 10px 12px; font-weight: 700; background: {{m.resultBg}}; color: {{m.resultFg}}">{{m.result}}</div>
          </sc-if>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{isActive}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{active}}" as="a" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 700">{{a.shop}}</span>
            <span style="font-size: 13px; color: #5B6661">المندوب: {{a.rep}}</span>
          </span>
          <span style="flex-shrink: 0; font-size: 13px; color: #5B6661">{{a.orders}} طلبات هذا الشهر</span>
        </div>
      </sc-for>
    </sc-if>
  </div>

  <nav style="display: flex; background: #FFFFFF; border-top: 1px solid #E3E7E4; padding: 6px 2px 10px; flex-shrink: 0">
    <a href="AdminDashboard.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
      <span>الرئيسية</span>
    </a>
    <a href="AdminOrders.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h4"></path></svg>
      <span>الطلبات</span>
    </a>
    <a href="AdminProducts.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
      <span>الأصناف</span>
    </a>
    <a href="AdminMerchants.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"></path><path d="M4 10h16v10H4z"></path><path d="M10 20v-5h4v5"></path></svg>
      <span>التجار</span>
    </a>
    <a href="AdminReps.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.8c1.8.8 3 2.6 3.5 5.2"></path></svg>
      <span>المندوبين</span>
    </a>
    <a href="AdminStaff.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <span>الحسابات</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'pending', decided: {}, picked: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const repNames = { 'R-12': '[اسم المندوب 1]', 'R-07': '[اسم المندوب 2]', 'R-15': '[اسم المندوب 3]' };
    const base = [
      { id: 'a', shop: '[اسم المحل 5]', owner: '[اسم المسؤول]', phone: '01XXXXXXXXX', address: '[المدينة والحي]', cr: '[رقم السجل]', repCode: 'R-12', when: 'اليوم 11:05 ص' },
      { id: 'b', shop: '[اسم المحل 7]', owner: '[اسم المسؤول]', phone: '01XXXXXXXXX', address: '[المدينة والحي]', cr: '', repCode: '', when: 'أمس 6:40 م' }
    ];
    const pending = base.map((m) => {
      const decision = this.state.decided[m.id] || '';
      const picked = this.state.picked[m.id] || '';
      const hasRep = !!m.repCode;
      const blocked = !hasRep && !picked;
      return {
        shop: m.shop,
        owner: m.owner,
        phone: m.phone,
        address: m.address,
        when: m.when,
        cr: m.cr || 'لم يُدخل',
        crColor: m.cr ? '#17201C' : '#5B6661',
        hasRep: hasRep,
        noRep: !hasRep && !decision,
        repName: repNames[m.repCode] || '',
        repCode: m.repCode,
        selectId: 'rep-' + m.id,
        pickRep: (e) => {
          const p = Object.assign({}, this.state.picked);
          p[m.id] = e && e.target ? e.target.value : '';
          this.setState({ picked: p });
        },
        blocked: blocked,
        approveBg: blocked ? '#E3E7E4' : accent,
        approveFg: blocked ? '#5B6661' : '#FFFFFF',
        open: !decision,
        decided: !!decision,
        result: decision === 'approved' ? 'تم التفعيل، وأُرسلت رسالة للتاجر.' : 'تم رفض الطلب.',
        resultBg: decision === 'approved' ? '#E3F1EB' : '#FBE9E5',
        resultFg: decision === 'approved' ? '#0B4A3B' : '#8A2A14',
        approve: () => {
          if (blocked) return;
          const d = Object.assign({}, this.state.decided);
          d[m.id] = 'approved';
          this.setState({ decided: d });
        },
        reject: () => {
          const d = Object.assign({}, this.state.decided);
          d[m.id] = 'rejected';
          this.setState({ decided: d });
        }
      };
    });
    const active = [
      { shop: '[اسم المحل 1]', rep: '[اسم المندوب 1]', orders: 2 },
      { shop: '[اسم المحل 2]', rep: '[اسم المندوب 1]', orders: 1 },
      { shop: '[اسم المحل 3]', rep: '[اسم المندوب 1]', orders: 1 },
      { shop: '[اسم المحل 6]', rep: '[اسم المندوب 2]', orders: 1 }
    ];
    const isPending = this.state.tab === 'pending';
    return {
      accent: accent,
      pending: pending,
      active: active,
      pendingCount: base.filter((m) => !this.state.decided[m.id]).length,
      isPending: isPending,
      isActive: !isPending,
      pendBg: isPending ? '#FFFFFF' : 'transparent',
      pendFg: isPending ? accent : '#5B6661',
      actBg: isPending ? 'transparent' : '#FFFFFF',
      actFg: isPending ? '#5B6661' : accent,
      showPending: () => this.setState({ tab: 'pending' }),
      showActive: () => this.setState({ tab: 'active' })
    };
  }
}
</script>
</body>
</html>
