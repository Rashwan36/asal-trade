<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>العروض</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Catalog.dc.html" aria-label="رجوع للأصناف" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17201C; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <h1 style="margin: 0; font-size: 19px; font-weight: 700">العروض</h1>
        <span style="font-size: 13px; color: #5B6661">{{count}} عروض متاحة لك الآن</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 4px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: {{o.bandBg}}; color: {{o.bandFg}}">
          <span style="font-size: 16px; font-weight: 700">{{o.headline}}</span>
          <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path></svg>
            {{o.ends}}
          </span>
        </div>
        <div style="padding: 12px 14px; display: flex; gap: 12px">
          <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 12px; background: #EEF1EF; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8A958F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 700">{{o.name}}</span>
            <span style="font-size: 13px; color: #3D4843; line-height: 1.5">{{o.detail}}</span>
            <sc-if value="{{o.hasPrice}}" hint-placeholder-val="{{ true }}">
              <span style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px">
                <span style="font-size: 16px; font-weight: 700; color: #A1361B">{{o.newPrice}}</span>
                <span style="font-size: 13px; color: #5B6661; text-decoration: line-through">{{o.oldPrice}}</span>
              </span>
            </sc-if>
          </div>
        </div>
        <div style="padding: 0 14px 14px">
          <sc-if value="{{o.notAdded}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{o.add}}" style="width: 100%; height: 46px; border-radius: 12px; border: 1px solid {{o.accent}}; background: #FFFFFF; color: {{o.accent}}; font-size: 15px; font-weight: 700; cursor: pointer">{{o.cta}}</button>
          </sc-if>
          <sc-if value="{{o.added}}" hint-placeholder-val="{{ false }}">
            <a href="Cart.dc.html" style="width: 100%; height: 46px; border-radius: 12px; background: #E3F1EB; color: #0B4A3B; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box">أُضيف للسلة — عرض السلة</a>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', added: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const types = {
      discount: { label: 'خصومات', bg: '#FBE9E5', fg: '#8A2A14' },
      gift: { label: 'هدايا', bg: '#E6EEFB', fg: '#1E4FA8' },
      qty: { label: 'خصم الكمية', bg: '#FDF1DE', fg: '#6B2E08' }
    };
    const all = [
      { id: 1, type: 'discount', headline: 'خصم 10%', name: '[اسم الصنف 1]', detail: 'على الكرتونة (24 علبة)', ends: 'ينتهي خلال 3 أيام', newPrice: '[السعر بعد الخصم] ج.م', oldPrice: '[السعر] ج.م', cta: 'أضف كرتونة للسلة' },
      { id: 2, type: 'gift', headline: '10 + 1 هدية', name: '[اسم الصنف 5]', detail: 'اطلب 10 دستات، وتحصل على دستة إضافية مجانًا. الهدية تُضاف تلقائيًا في السلة.', ends: 'حتى 30 نوفمبر', cta: 'أضف 10 دستات للسلة' },
      { id: 3, type: 'qty', headline: 'أرخص بالكمية', name: '[اسم الصنف 2]', detail: 'من 5 كراتين فأكثر يصبح سعر الكرتونة أقل.', ends: 'حتى 15 ديسمبر', newPrice: '[سعر الكمية] ج.م', oldPrice: '[السعر] ج.م', cta: 'أضف 5 كراتين للسلة' },
      { id: 4, type: 'discount', headline: 'خصم 15 ج.م', name: '[اسم الصنف 6]', detail: 'على كل جالون', ends: 'ينتهي غدًا', newPrice: '[السعر بعد الخصم] ج.م', oldPrice: '[السعر] ج.م', cta: 'أضف جالون للسلة' }
    ];
    const f = this.state.filter;
    const offers = all.filter((o) => f === 'all' || o.type === f).map((o) => {
      const t = types[o.type];
      const added = !!this.state.added[o.id];
      return {
        headline: o.headline, name: o.name, detail: o.detail, ends: o.ends,
        hasPrice: !!o.newPrice, newPrice: o.newPrice || '', oldPrice: o.oldPrice || '',
        bandBg: t.bg, bandFg: t.fg, cta: o.cta, accent: accent,
        added: added, notAdded: !added,
        add: () => { const a = Object.assign({}, this.state.added); a[o.id] = true; this.setState({ added: a }); }
      };
    });
    const defs = [['all', 'الكل'], ['discount', 'خصومات'], ['gift', 'هدايا'], ['qty', 'خصم الكمية']];
    const filters = defs.map((d) => {
      const on = d[0] === f;
      return { label: d[1], bg: on ? accent : '#FFFFFF', fg: on ? '#FFFFFF' : '#17201C', border: on ? accent : '#C9D1CC', pick: () => this.setState({ filter: d[0] }) };
    });
    return { accent: accent, offers: offers, filters: filters, count: all.length };
  }
}
</script>
</body>
</html>
