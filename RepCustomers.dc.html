<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المندوب — عملائي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B57}a:hover{color:#0A4F40}
input,button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #17201C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 20px 16px 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">عملائي</h1>
      <span style="font-size: 14px; color: #5B6661">{{total}} عميل · {{pending}} منتظر التفعيل</span>
    </div>
    <div style="position: relative">
      <label for="custSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">بحث في العملاء</label>
      <input id="custSearch" type="search" placeholder="ابحث باسم المحل أو المنطقة" style="width: 100%; height: 46px; box-sizing: border-box; border: 1px solid #C9D1CC; border-radius: 12px; padding: 0 44px 0 14px; font-size: 15px; background: #F5F7F6; color: #17201C">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{customers}}" as="c" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center">
        <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #EEF1EF; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"></path><path d="M4 10h16v10H4z"></path><path d="M10 20v-5h4v5"></path></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <span style="font-size: 15px; font-weight: 700">{{c.shop}}</span>
            <span style="font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 12px; background: {{c.badgeBg}}; color: {{c.badgeFg}}">{{c.badge}}</span>
          </div>
          <span style="font-size: 13px; color: #5B6661">{{c.area}}</span>
          <span style="font-size: 13px; color: #5B6661">{{c.meta}}</span>
        </div>
        <a href="#" aria-label="اتصال بالعميل" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid #C9D1CC; display: flex; align-items: center; justify-content: center; color: {{c.accent}}; text-decoration: none; box-sizing: border-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
        </a>
      </div>
    </sc-for>
  </div>

  <nav style="display: flex; background: #FFFFFF; border-top: 1px solid #E3E7E4; padding: 6px 8px 10px; flex-shrink: 0">
    <a href="RepHome.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 9.5V20h12V9.5"></path></svg>
      <span>الرئيسية</span>
    </a>
    <a href="RepCustomers.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10"></path><path d="M4 10h16v10H4z"></path><path d="M10 20v-5h4v5"></path></svg>
      <span>عملائي</span>
    </a>
    <a href="#" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <span>حسابي</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B57","options":["#0E6B57","#1F4E8C","#9A3412","#3F3D9E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0E6B57';
    const list = [
      { shop: '[اسم المحل 1]', area: '[المنطقة]', active: true, orders: 2, last: '9 نوفمبر' },
      { shop: '[اسم المحل 2]', area: '[المنطقة]', active: true, orders: 1, last: '8 نوفمبر' },
      { shop: '[اسم المحل 3]', area: '[المنطقة]', active: true, orders: 1, last: '7 نوفمبر' },
      { shop: '[اسم المحل 4]', area: '[المنطقة]', active: true, orders: 1, last: '2 نوفمبر' },
      { shop: '[اسم المحل 5]', area: '[المنطقة]', active: false, orders: 0, last: '' }
    ];
    const customers = list.map((c) => ({
      shop: c.shop,
      area: c.area,
      badge: c.active ? 'نشط' : 'منتظر التفعيل',
      badgeBg: c.active ? '#E3F1EB' : '#FDF1DE',
      badgeFg: c.active ? '#0B5A47' : '#8A3B0A',
      meta: c.active ? (c.orders + ' طلبات هذا الشهر · آخر طلب ' + c.last) : 'سجّل بكودك، وحسابه قيد المراجعة',
      accent: accent
    }));
    return {
      accent: accent,
      customers: customers,
      total: list.length,
      pending: list.filter((c) => !c.active).length
    };
  }
}
</script>
</body>
</html>
